<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project review</title>
    <style>
      html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <iframe src="/website/" title="Portfolio project review"></iframe>
    <script>
      const frame = document.querySelector('iframe');
      frame.addEventListener('load', () => {
        window.setTimeout(() => frame.contentDocument.querySelector('#featured-projects')?.scrollIntoView(), 1800);
      });
    </script>
  </body>
</html>
